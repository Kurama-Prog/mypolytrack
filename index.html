<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E1A2B" />
    <title>MyPolyTrack — Low-Poly Time Trial Racing</title>
    <meta
      name="description"
      content="MyPolyTrack is a low-poly browser racing game. Three handcrafted circuits, ghost replays, local leaderboards and live acceleration / brake tuning."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E1A2B'/%3E%3Cpath d='M16 5l9 22H7z' fill='%23FF5A3C'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui"></div>
      <div class="fade" id="fade"></div>
      <div class="boot" id="boot">
        <div class="boot-inner">
          <div class="boot-word">MYPOLYTRACK</div>
          <div class="boot-bar"><i id="boot-fill"></i></div>
          <div class="boot-note" id="boot-note">BUILDING CIRCUITS</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
